    id: tab-index
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: d-home
- tapOn:
    id: tab-plans
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: d-plans
- tapOn:
    id: tab-wearable
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: d-wearable
- tapOn:
    id: tab-claims
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: d-claims
- openLink: pulsecover:///calculator
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: d-calculator
- openLink: pulsecover:///apply
