appId: my.group5.pulsecover
---
- launchApp:
    clearState: true
- openLink: pulsecover://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Create account"
    timeout: 90000
- takeScreenshot: i-welcome
- tapOn:
    id: btn-create-account
- extendedWaitUntil:
    visible:
      id: f-full-name
    timeout: 20000
- takeScreenshot: i-register
